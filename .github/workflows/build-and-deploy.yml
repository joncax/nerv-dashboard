name: Build and Deploy
on:
  push:
    branches:
      - develop
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout nerv-dashboard
        uses: actions/checkout@v4
      - name: Determinar ambiente e tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "values_file=values-prod.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "values_file=values-dev.yaml" >> "$GITHUB_OUTPUT"
          fi
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push - backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/joncax/nerv-dashboard-backend:${{ steps.vars.outputs.image_tag }}
            ghcr.io/joncax/nerv-dashboard-backend:latest
      - name: Build e push - frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/joncax/nerv-dashboard-frontend:${{ steps.vars.outputs.image_tag }}
            ghcr.io/joncax/nerv-dashboard-frontend:latest
      - name: Checkout nerv-gitops
        uses: actions/checkout@v4
        with:
          repository: joncax/nerv-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: nerv-gitops
      - name: Atualizar tags no values file
        run: |
          cd nerv-gitops/apps/nerv-dashboard
          sed -i "s/tag: \".*\"/tag: \"${{ steps.vars.outputs.image_tag }}\"/" ${{ steps.vars.outputs.values_file }}
      - name: Commit e push no nerv-gitops
        run: |
          cd nerv-gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/nerv-dashboard/${{ steps.vars.outputs.values_file }}
          git commit -m "chore: atualizar imagem para ${{ steps.vars.outputs.image_tag }} (${{ steps.vars.outputs.environment }})" || echo "Nada para commitar"
          git push origin main